title: the Seventh Week after Epiphany
subtitle: The Purity of Daniel
week: 13
season: epiphany

readings:
  - Daniel 6
  - Psalm 40:7-17
  - 2 Timothy 4:16-18

musicpages:
  - I Have Decided to Follow Jesus

prayer:
  text: >
    Oh Lord, the great and awesome God, who keeps his covenant and mercy with those who love him and keep his commandments: forgive us where we have sinned and rebelled against you. Correct us when we err and call us by your word. Show us the path of righteousness that we may walk in it. Hear our prayer, oh Lord, by your great mercy.
